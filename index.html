<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050814" />
  <title>A Planilha Inteligente</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./logo-a.jpg" />
  <link rel="stylesheet" href="./styles.css?v=41" />
</head>
<body>
  <canvas id="nebula" aria-hidden="true"></canvas>
  <div id="chrome-only" hidden>
    <div class="chrome-card">
      <img class="mark" src="./logo.jpg" alt="">
      <p class="kicker">A Planilha Inteligente</p>
      <h1>Abra no Google Chrome</h1>
      <p class="sub">Este app foi programado para rodar só no Chrome.</p>
      <p class="muted" id="chrome-url"></p>
    </div>
  </div>
  <div id="gate" hidden>
    <div class="gate-card">
      <p class="kicker"><span class="brand-a">A</span> Planilha Inteligente</p>
      <h1>Identifique-se para iniciar</h1>
      <label class="muted" for="gateName">Seu nome</label>
      <input id="gateName" placeholder="Como quer ser chamado" autocomplete="name">
      <label class="muted" for="gateEmail">E-mail</label>
      <input id="gateEmail" type="email" placeholder="seu@email.com" autocomplete="email">
      <label class="muted" for="gatePass">Senha</label>
      <input id="gatePass" type="password" placeholder="mínimo 6 caracteres" autocomplete="current-password">
      <button class="btn" id="gateStart" type="button">Entrar</button>
      <p class="muted" id="gateErr"></p>
    </div>
  </div>
  <header class="topbar">
    <img class="brand-logo" src="./logo-a.jpg" alt="">
    <strong class="brand-name-full"><span class="brand-a">A</span> Planilha Inteligente</strong>
  </header>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand">
        <button type="button" id="userChip" class="user-chip" title="Usuário">
          <img id="userPhoto" class="brand-logo lg" src="./logo-a.jpg" alt="">
          <span class="user-chip-name" id="userChipName">Seu nome</span>
        </button>
        <button type="button" id="menu" class="side-arrow" aria-label="Recolher barra">‹</button>
      </div>
      <nav>
        <button type="button" data-nav="comando" title="Início"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg></i><span class="nav-label">INÍCIO</span></button>
        <button type="button" data-nav="ciclo" title="Plano de Estudos"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3.5V7M16 3.5V7M4 10h16"/></svg></i><span class="nav-label">PLANO DE ESTUDOS</span></button>
        <button type="button" data-nav="questoes" title="Questões"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h11M8 12h11M8 17h11"/><path d="m4 7 1.2 1.2L7.5 6M4 12l1.2 1.2L7.5 11M4 17l1.2 1.2L7.5 16"/></svg></i><span class="nav-label">QUESTÕES</span></button>
        <button type="button" data-nav="simulados" title="Simulados"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="12" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></i><span class="nav-label">SIMULADOS</span></button>
        <button type="button" data-nav="desempenho" title="Desempenho"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M10 19V7M15 19v-5M20 19V5"/></svg></i><span class="nav-label">DESEMPENHO</span></button>
        <button type="button" data-nav="sobre" title="Pergunte às IAs"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 13.6 9 19 10.5 13.6 12 12 17.5 10.4 12 5 10.5 10.4 9z"/></svg></i><span class="nav-label">Pergunte às IAs</span></button>
        <button type="button" data-nav="edital" title="Edital"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l5 5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V9h5M9 13h6M9 17h4"/></svg></i><span class="nav-label">EDITAL</span></button>
        <button type="button" data-nav="radar" title="Radar"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 12l5-3M12 4.5V8M4.5 12H8"/></svg></i><span class="nav-label">RADAR</span></button>
        <button type="button" data-nav="planilha" title="Mural"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></svg></i><span class="nav-label">MURAL</span></button>
        <button type="button" data-nav="anki" title="Anki"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="6" width="12" height="14" rx="2"/><path d="M5 16V6.5A2 2 0 0 1 7 4.5h9"/></svg></i><span class="nav-label">ANKI</span></button>
        <button type="button" data-nav="turma" title="Turma"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3.2A2 2 0 0 1 5 14.5z"/></svg></i><span class="nav-label">TURMA</span></button>
      </nav>
      <button type="button" id="logoutBtn" class="logout-btn" title="Sair"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6H6.5A1.5 1.5 0 0 0 5 7.5v9A1.5 1.5 0 0 0 6.5 18H9M10 12h9M15 8l4 4-4 4"/></svg></i><span class="nav-label">Sair</span></button>
      <div class="side-tools">
        <button type="button" id="eyeFit" class="eye-fit" title="Fonte e visual" aria-expanded="false" aria-label="Fonte e visual">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6.5 6.5 12 6.5 21.5 12 21.5 12 17.5 17.5 12 17.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
        </button>
        <button type="button" id="backupBtn" class="backup-btn" title="Backup" aria-label="Backup">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h7l3 3V19a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1z"/><path d="M14 4.5V8h3M8 13h8M8 16h5"/></svg>
        </button>
        <div class="zoom-box zoom-pop" id="zoomPop" hidden>
          <button type="button" data-zoom="-">A−</button>
          <span class="muted" id="zoomLbl">100%</span>
          <button type="button" data-zoom="+">A+</button>
          <button type="button" data-view="barras" title="Barras">Barras</button>
          <button type="button" data-view="blocos" title="Blocos">Blocos</button>
        </div>
        <div class="backup-float" id="backupFloat" hidden>Backup</div>
      </div>
    </aside>
    <main class="main" id="view"></main>
    <aside class="dock" id="dock">
      <div class="presence" id="presence">
        <strong>Na plataforma agora</strong>
        <div class="muted" id="presenceList">só você</div>
      </div>
      <div class="dock-head">
        <strong>Turma ao vivo</strong>
        <span class="muted">direita</span>
      </div>
      <div class="dock-log" id="dockLog"></div>
      <div class="dock-in">
        <input id="dockIn" placeholder="Mensagem para a turma ou para as IAs.">
        <button class="btn ghost" id="dockMic" type="button">Áudio</button>
        <button class="btn" id="dockSend" type="button">Enviar</button>
      </div>
    </aside>
  </div>
  <div class="ia-overlay" id="iaOverlay" hidden>
    <div class="ia-modal" role="dialog" aria-modal="true" aria-labelledby="iaModalTitle">
      <button type="button" class="ia-x" id="iaClose" aria-label="Fechar">×</button>
      <p class="kicker" id="iaModalTitle">Pergunte às IAs</p>
      <div id="iaModalBody"></div>
    </div>
  </div>
  <div class="ia-overlay" id="metricOverlay" hidden>
    <div class="ia-modal" role="dialog" aria-modal="true" aria-labelledby="metricTitle">
      <button type="button" class="ia-x" id="metricClose" aria-label="Fechar">×</button>
      <p class="kicker" id="metricTitle">Cálculo</p>
      <div id="metricBody"></div>
    </div>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var chrome = (/Chrome\//.test(ua) || /CriOS\//.test(ua)) && !/Edg|OPR|Opera|SamsungBrowser|Firefox|FxiOS/.test(ua);
      var gate = document.getElementById("chrome-only");
      var url = document.getElementById("chrome-url");
      if (url) url.textContent = location.href;
      if (!chrome && gate) {
        gate.hidden = false;
        document.documentElement.classList.add("chrome-blocked");
      }
    })();
  </script>
  <script>
    window.PI_PEER = function () {
      if (window.Peer) return Promise.resolve();
      if (window.__peerP) return window.__peerP;
      window.__peerP = new Promise(function (ok, fail) {
        var s = document.createElement("script");
        s.src = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
        s.async = true;
        s.onload = function () { ok(); };
        s.onerror = fail;
        document.head.appendChild(s);
      });
      return window.__peerP;
    };
  </script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script defer src="./firebase-config.js?v=14"></script>
  <script defer src="./engine.js"></script>
  <script defer src="./projetos/gcm-nisia.js"></script>
  <script defer src="./projetos/modelo.js"></script>
  <script defer src="./gpu.js?v=12"></script>
  <script defer src="./radar.js?v=2"></script>
  <script defer src="./atlas.js?v=14"></script>
  <script defer src="./leitor-edital.js?v=5"></script>
  <script defer src="./comando.js?v=2"></script>
  <script defer src="./app.js?v=36"></script>
  <script defer src="./session.js?v=19"></script>
</body>
</html>
